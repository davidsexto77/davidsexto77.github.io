<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bienvenido - Enlaces</title>
        <link rel="icon" type="imagen/png" href="Imagenes/icono.png">
        <style>

            body {
                background: linear-gradient(to right, #a1c4fd, #c2e9fb);
                font-family: 'Times New Roman', Tahoma, sans-serif;
                margin: 0;
                padding: 0;
                line-height: 1.6;
                color: #000000;
            }

            header {
                background-color: #5fbbf8;
                color: #5fbbf8b6;
                text-align: center;
                padding: 20px 0;
                box-shadow: 0 4px 6px rgba(0,0,0,0.2);
                transition: 0.5s;
            }
            header:hover {
                background-color:#5fbbf891;
            }
            h1 {
                text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
                color: rgb(0, 0, 0); 
            }

            h2 {
                text-align: center;
                margin-top: 40px;
                color: #000000;
            }

             nav {
                list-style-type: disc; 
                text-align: center ; 
            }


            footer {
                text-align: center;
                padding: 10px 0;
                font-size: 0.9em;
                color: #000000;
            }
            footer strong {
                color: #000000;
            }

            /* vamos a ponerle formato a los enlaces */
            /* Estilos iniciales del enlace */
                .enlaces {
                    color: #0000FF; /* Azul inicial */
                    text-decoration: none; /* Quita el subrayado predeterminado */
                    font-weight: bold;
                }

                /* Estilos aplicados SOLAMENTE al pasar el ratón */
                .enlaces:hover {
                    color: #FF8C00; /* Naranja al hacer hover */
                    text-decoration: underline; /* Opcional: añade un subrayado */
                }
                /* esto para el puto boton */
                /* 🔷 Estilos Iniciales del Botón (Estado por defecto) */
                .mi-boton {
                    background-color: #007bff; /* Color inicial de fondo: Azul */
                    color: white;              /* Color del texto: Blanco */
                    padding: 10px 20px;        /* Espaciado interno */
                    border: none;              /* Quitar el borde predeterminado */
                    border-radius: 5px;        /* Bordes redondeados */
                    cursor: pointer;           /* Puntero interactivo */
                    transition: background-color 0.3s ease; /* Transición suave */
                }

                /* 🔴 Estilos Aplicados al Pasar el Ratón (Estado :hover) */
                .mi-boton:hover {
                    background-color: #0056b3; /* Color de fondo al hacer hover: Azul Oscuro */
                }
        </style>
    </head>
    <body>
        <header>
            <h1>Más Enlaces</h1>
        </header>
        <h2>Mis Páginas</h2>
        <nav>
                
                    
        
                    <p>- Ir a <a href="https://www.instagram.com/daviii__2507/" class="enlaces">Instagram</a></p>
                    <p>- Ir a <a href="https://x.com/GlxdeKroos" class="enlaces">X (Twitter)</a></p>
                    <!-- <p>- Ir a <a href="https://www.instagram.com/daviii__2507/">Spotify</a></p> -->
                    
                
        </nav>
        <footer>
            <br>
            <hr>
            <button class="mi-boton"><a href="index.html">Volver al Index</a></button>
            <p>DAVID SEXTO - 2025 &copy; </p>
        </footer>
    </body>
</html>
