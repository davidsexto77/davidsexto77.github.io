<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flow-a {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes flow-b {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }
        .path-a { 
            stroke: #6366f1; 
            stroke-dasharray: 4 4;
            animation: flow-a 1s linear infinite;
        }
        .path-b { 
            stroke: #a855f7; 
            stroke-dasharray: 4 4;
            animation: flow-b 1s linear infinite;
        }
        .san-box {
            box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans p-4 flex justify-center items-center min-h-screen">

    <div class="max-w-3xl w-full bg-slate-800/50 p-8 rounded-3xl border border-slate-700 shadow-2xl relative overflow-hidden">
        
        <!-- Contenedor Principal del Diagrama -->
        <div class="relative h-[500px] w-full">
            
            <!-- SVG para las Líneas de Conexión -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 600 500">
                <!-- Conexiones Servidor A -->
                <path d="M150,85 L100,200" class="path-a" fill="none" stroke-width="2" />
                <path d="M150,85 L500,200" class="path-b" fill="none" stroke-width="2" />
                
                <!-- Conexiones Servidor B -->
                <path d="M450,85 L100,200" class="path-a" fill="none" stroke-width="2" />
                <path d="M450,85 L500,200" class="path-b" fill="none" stroke-width="2" />

                <!-- Conexiones de Switches a Cabinas -->
                <path d="M100,260 L250,400" class="path-a" fill="none" stroke-width="2" />
                <path d="M500,260 L350,400" class="path-b" fill="none" stroke-width="2" />
            </svg>

            <!-- SERVIDORES (Capa Superior) -->
            <div class="absolute top-0 w-full flex justify-around px-10">
                <!-- Servidor A -->
                <div class="flex flex-col items-center">
                    <div class="w-32 py-4 bg-slate-800 border-2 border-indigo-500/50 rounded-xl san-box flex flex-col items-center z-10 relative">
                        <svg class="w-8 h-8 text-indigo-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"></path></svg>
                        <span class="text-[10px] font-bold uppercase">Servidor A</span>
                        <!-- Puertos HBA Integrados -->
                        <div class="flex gap-4 mt-2">
                            <div class="w-1.5 h-1.5 bg-indigo-500 rounded-full" title="Puerto FC 1"></div>
                            <div class="w-1.5 h-1.5 bg-purple-500 rounded-full" title="Puerto FC 2"></div>
                        </div>
                    </div>
                </div>
                <!-- Servidor B -->
                <div class="flex flex-col items-center">
                    <div class="w-32 py-4 bg-slate-800 border-2 border-indigo-500/50 rounded-xl san-box flex flex-col items-center z-10 relative">
                        <svg class="w-8 h-8 text-indigo-400 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"></path></svg>
                        <span class="text-[10px] font-bold uppercase">Servidor B</span>
                        <!-- Puertos HBA Integrados -->
                        <div class="flex gap-4 mt-2">
                            <div class="w-1.5 h-1.5 bg-indigo-500 rounded-full" title="Puerto FC 1"></div>
                            <div class="w-1.5 h-1.5 bg-purple-500 rounded-full" title="Puerto FC 2"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SWITCHES (Capa Media) -->
            <!-- Switch A -->
            <div class="absolute top-[200px] left-10">
                <div class="w-32 p-3 bg-indigo-950 border-2 border-indigo-500 rounded-lg san-box z-10">
                    <div class="flex justify-between mb-2">
                        <div class="flex gap-1">
                            <div class="w-1 h-1 bg-green-400 rounded-full animate-pulse"></div>
                            <div class="w-1 h-1 bg-green-400 rounded-full"></div>
                        </div>
                        <span class="text-[7px] text-indigo-300 font-bold uppercase">FC Switch</span>
                    </div>
                    <p class="text-[9px] font-black text-center text-indigo-100 uppercase">SAN Switch A</p>
                    <p class="text-[7px] text-center text-indigo-400 mt-1 uppercase tracking-widest">(Fabric A)</p>
                </div>
            </div>

            <!-- Switch B -->
            <div class="absolute top-[200px] right-10">
                <div class="w-32 p-3 bg-purple-950 border-2 border-purple-500 rounded-lg san-box z-10">
                    <div class="flex justify-between mb-2">
                        <div class="flex gap-1">
                            <div class="w-1 h-1 bg-green-400 rounded-full animate-pulse"></div>
                            <div class="w-1 h-1 bg-green-400 rounded-full"></div>
                        </div>
                        <span class="text-[7px] text-purple-300 font-bold uppercase">FC Switch</span>
                    </div>
                    <p class="text-[9px] font-black text-center text-purple-100 uppercase">SAN Switch B</p>
                    <p class="text-[7px] text-center text-purple-400 mt-1 uppercase tracking-widest">(Fabric B)</p>
                </div>
            </div>

            <!-- CABINAS DE DATOS (Capa Inferior) -->
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2">
                <div class="w-64 p-5 bg-slate-800 border-2 border-slate-600 rounded-2xl shadow-2xl z-10">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest">Cabinas de Datos</span>
                        <div class="flex gap-1">
                            <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_#10b981]"></div>
                            <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_#10b981]"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col items-center p-2 bg-slate-900/50 rounded-lg border border-indigo-500/30">
                            <span class="text-[7px] text-indigo-300 font-bold mb-2 uppercase text-center">Cabina A</span>
                            <div class="w-full h-1 bg-indigo-500/40 rounded"></div>
                        </div>
                        <div class="flex flex-col items-center p-2 bg-slate-900/50 rounded-lg border border-purple-500/30">
                            <span class="text-[7px] text-purple-300 font-bold mb-2 uppercase text-center">Cabina B</span>
                            <div class="w-full h-1 bg-purple-500/40 rounded"></div>
                        </div>
                    </div>
                    <div class="mt-4 flex justify-center gap-1 opacity-40">
                        <div class="w-4 h-6 bg-slate-700 rounded-sm"></div>
                        <div class="w-4 h-6 bg-slate-700 rounded-sm"></div>
                        <div class="w-4 h-6 bg-slate-700 rounded-sm"></div>
                        <div class="w-4 h-6 bg-slate-700 rounded-sm"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Leyenda -->
        <div class="mt-12 flex justify-center gap-10 border-t border-slate-700 pt-6">
            <div class="flex items-center gap-2">
                <div class="w-4 h-0.5 bg-indigo-500"></div>
                <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">Fabric A</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-0.5 bg-purple-500"></div>
                <span class="text-[8px] font-bold uppercase tracking-widest text-slate-400">Fabric B</span>
            </div>
        </div>
    </div>

</body>
</html>
