<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes block-flow {
            from { stroke-dashoffset: 60; }
            to { stroke-dashoffset: 0; }
        }
        .block-line-active {
            stroke-dasharray: 12;
            animation: block-flow 0.8s linear infinite;
        }
        .svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-900 p-4 flex justify-center items-center min-h-screen">

    <div class="relative bg-slate-900 p-8 rounded-xl w-full max-w-xl min-h-[550px] flex flex-col items-center border border-slate-800 shadow-2xl overflow-visible">
        
        <!-- Dispositivos de Red (Totalmente desconectados del DAS) -->
        <div class="flex justify-around w-full mt-4 mb-20 relative z-10 opacity-20">
            <div class="flex flex-col items-center p-3 bg-slate-800 rounded-lg border border-slate-700 w-24 grayscale">
                <svg class="w-8 h-8 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                <span class="text-[10px] uppercase font-bold text-slate-500 text-center leading-none">Smartphone<br>(Sin acceso)</span>
            </div>

            <!-- PC Host: El único con el cable físico -->
            <div class="flex flex-col items-center p-3 bg-blue-900/20 rounded-lg border-2 border-blue-500 w-28 shadow-lg opacity-100 grayscale-0 relative">
                <svg class="w-8 h-8 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span class="text-[10px] uppercase font-bold text-blue-300 text-center">PC MAESTRO</span>
                <div class="absolute -bottom-10 bg-blue-600 text-[8px] text-white px-2 py-0.5 rounded-full font-bold tracking-tighter">DUEÑO DEL BUS</div>
            </div>

            <div class="flex flex-col items-center p-3 bg-slate-800 rounded-lg border border-slate-700 w-24 grayscale">
                <svg class="w-8 h-8 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span class="text-[10px] uppercase font-bold text-slate-500 text-center leading-none">Smart TV<br>(Sin acceso)</span>
            </div>
        </div>

        <!-- Capa SVG: Conexión física directa -->
        <svg class="svg-layer" viewBox="0 0 400 500" preserveAspectRatio="none">
            <!-- El cable es más grueso para representar mayor ancho de banda local -->
            <path d="M 200 155 L 200 350" class="block-line-active" stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" />
            
            <!-- Bloque de Protocolo -->
            <rect x="150" y="240" width="100" height="24" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
            <text x="200" y="256" font-family="monospace" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">SCSI / SAS / USB</text>
        </svg>

        <!-- Unidad DAS -->
        <div class="mt-32 flex flex-col items-center z-10">
            <div class="w-36 h-24 bg-amber-800 rounded-lg flex flex-row items-center p-4 shadow-2xl border-r-8 border-amber-950 border-b-4 border-slate-900/50">
                <!-- Luces de actividad local -->
                <div class="flex flex-col gap-2 mr-4">
                    <div class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-pulse shadow-[0_0_8px_#fbbf24]"></div>
                    <div class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-pulse shadow-[0_0_8px_#fbbf24]"></div>
                </div>
                <!-- Representación de Bloques de Disco -->
                <div class="flex-grow grid grid-cols-1 gap-2">
                    <div class="h-3 bg-amber-950/80 rounded relative overflow-hidden">
                        <div class="absolute inset-0 bg-amber-500/20 animate-pulse"></div>
                    </div>
                    <div class="h-3 bg-amber-950/80 rounded"></div>
                    <div class="h-3 bg-amber-950/80 rounded"></div>
                </div>
            </div>
            
            <div class="mt-6 text-center">
                <span class="block font-black text-amber-500 text-sm tracking-[0.3em] uppercase">DIRECT STORAGE</span>
                <div class="flex flex-col items-center gap-2 mt-2">
                    <div class="flex gap-1">
                        <span class="text-[9px] font-mono text-amber-500 bg-amber-950 px-2 py-0.5 rounded border border-amber-500/30 font-bold">BLOCK-LEVEL ACCESS</span>
                        <span class="text-[9px] font-mono text-white bg-red-600 px-2 py-0.5 rounded font-bold">NO IP / NO NIC</span>
                    </div>
                    <p class="text-[8px] text-slate-500 italic max-w-[200px]">Dependencia absoluta del sistema de archivos del PC Host</p>
                </div>
            </div>
        </div>

        <!-- Marca de "Isla de Datos" -->
        <div class="absolute top-1/2 left-4 -translate-y-1/2 rotate-90 origin-left opacity-10 pointer-events-none">
            <span class="text-6xl font-black text-slate-700 uppercase tracking-tighter">DATA ISLAND</span>
        </div>

    </div>

</body>
</html>
